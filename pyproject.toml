[project]
name = "ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.1.0",
    "fastapi>=0.129.2",
    "isort>=8.0.0",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.14",
    "langchain-openai>=1.1.10",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.17",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.0.9",
    "langsmith[openai-agents]>=0.7.6",
    "lingua-language-detector>=2.2.0",
    "pinecone>=7.3.0",
    "pydantic>=2.12.5",
    "pypdf>=6.7.1",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.54.0",
    "uvicorn>=0.34.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # LangChain + Pydantic v2 internal serialization mismatch — not user code
    "ignore:Pydantic serializer warnings:UserWarning",
]
