name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        env:
          OPENAI_API_KEY: dummy-key-for-import-only
          PINECONE_API_KEY: dummy-key-for-import-only
          PINECONE_INDEX_NAME: test-index
          TAVILY_API_KEY: dummy-key-for-import-only
        run: uv run pytest